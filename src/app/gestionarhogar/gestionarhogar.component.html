<div class="bienvenida-container">
  <header class="header">
    <div class="logo">
      <img src="/verificacion.png" alt="Logo" />
      <span class="titulo">ApuntaNet</span>
    </div>
  </header>

<div class="hogar-fondo">
  <div class="hogar-container">
    <div class="hogar-titulo" style="margin-bottom: 1rem;">
      <p>Gestionando el hogar: <span class="hogar-nombre"><strong>{{ nombreHogar }}</strong></span></p>
    </div>
    <div class="hogar-main">
      <nav class="hogar-menu">
        <button 
          class="menu-btn"
          [ngClass]="{ 'activo': seccionActiva === 'gastos' }"
          (click)="seccionActiva = 'gastos'">Control de Gastos</button>

        <button 
          class="menu-btn"
          [ngClass]="{ 'activo': seccionActiva === 'residentes' }"
          (click)="mostrarResidentes()">Residentes</button>

        <button class="menu-btn" routerLink="/bienvenida">Volver</button>
      </nav>
      <section class="hogar-contenido">
          <!-- SECCIÓN DE CONTROL DE GASTOS -->
        <div *ngIf="seccionActiva === 'gastos'">
          <h3>Control de Gastos</h3>
          <div class="grid-gastos">
            <button type="button" class="btn-primary centro" (click)="mostrarModalCategoria(); $event.stopPropagation()">Crear categoria</button>

            <button class="btn-primary izquierda">Generar ticket</button>
            <button class="btn-primary derecha">
            {{ esCreador ? 'Monto hogar' : 'Monto individual' }}
            </button>
            <button *ngIf="esCreador" class="btn-primary centro">Revisar Ticket</button>
          </div>
        </div>

        <!-- SECCIÓN DE CONTROL DE RESIDENTES -->
        <div *ngIf="seccionActiva === 'residentes' && residentes.length > 0">
          <h3>Residentes:</h3>
          <ul>
            <li *ngFor="let r of residentes">
              <strong>{{ r.usuario }}</strong> <span *ngIf="r.es_creador" class="creador-tag"> (Creador)</span><br>
              {{ r.correo }}<br>
              <small>Fecha de ingreso: {{ r.fecha | date:'mediumDate' }}</small>
            </li>
          </ul>
        </div>
      </section>
    </div>
  </div>
</div>

<!--  -->
<!-- SECCCIÓN DE CREAR CATEGORIA -->
 <!--  -->
  <div class="modal-fondo" *ngIf="modalVisible==1 && error==1">
    <div class="modal-contenido" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h3>Crear nueva categoria</h3>
      </div>
      <div class="modal-body">
        <form [formGroup]="crearCategoriaForm">
          <div class="form-grupo">
            <label for="nombreCategoria">Nombre categoria *</label>
            <input 
              type="text" 
              id="nombreCategoria"
              formControlName="nombreCategoria"
              [class.error]="(crearCategoriaForm.get('nombreCategoria')?.touched || submitted) && crearCategoriaForm.get('nombreCategoria')?.invalid"
            >
            <div class="mensaje-error" *ngIf="getMensajeError('nombreCategoria')">
              {{ getMensajeError('nombreCategoria') }}
            </div>
          </div>
          <div class="form-grupo">
            <label for="descripcion">Descripción</label>
            <textarea 
              id="descripcion" 
              formControlName="descripcion"
              rows="4"
              [class.error]="(crearCategoriaForm.get('descripcion')?.touched || submitted) && crearCategoriaForm.get('descripcion')?.invalid"
            ></textarea>
            <div class="mensaje-error" *ngIf="getMensajeError('descripcion')">
              {{ getMensajeError('descripcion') }}
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn-secondary" (click)="cerrarModal()">Cancelar</button>
            <button type="submit" class="btn-primary">Crear categoria</button>
          </div>
        </form>
      </div>
    </div>
  </div>
