<h1>Bienvenido a ApuntaNet</h1>
<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
  <label>
    Usuario:
    <input type="user" formControlName="usuario">
  </label>
  <small *ngIf="loginForm.get('usuario')?.invalid && loginForm.get('usuario')?.touched" style="color: red;">
    El nombre de usuario es obligatorio.
  </small>
  <br><br>
  <label>
    Contraseña:
    <input type="password" formControlName="contrasena">
  </label>
  <small *ngIf="loginForm.get('contrasena')?.errors?.['required'] && loginForm.get('contrasena')?.touched" style="color: red;">
    La contraseña es obligatoria.
  </small>
  <br><br>
  <button type="submit" [disabled]="loginForm.invalid">Ingresar</button>
</form>

<p>¿No tienes cuenta? <a routerLink="/registro">Regístrate aquí</a></p>
