<div class="page-container login-page"> 
  
  <div class="card login-container fade-in">
    <div class="login-header text-center">
      <h2>Iniciar Sesión</h2>
      <p>Bienvenido</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="usuario">Usuario</label>
        <input 
          type="text" 
          id="usuario" 
          formControlName="usuario" 
          placeholder="Ingresa tu usuario"
          [class.is-invalid]="loginForm.get('usuario')?.invalid && loginForm.get('usuario')?.touched"
        >
        <div *ngIf="loginForm.get('usuario')?.invalid && loginForm.get('usuario')?.touched" class="text-error mt-1">
          Usuario es requerido
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          formControlName="password" 
          placeholder="Ingresa tu contraseña"
          [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
        >
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="text-error mt-1">
          Contraseña es requerida
        </div>
      </div>

      <button type="submit" class="btn btn-primary mt-3" [disabled]="loginForm.invalid">
        Iniciar Sesión
      </button>
      <button type="submit" class="btn btn-primary mt-3" routerLink="/landingpage">
        Volver
      </button>
      <p class="text-center mt-2">¿No tienes cuenta? <a routerLink="/registro">Regístrate aquí</a></p>
    </form>
  </div>
</div>
